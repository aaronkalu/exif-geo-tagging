[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "exif-geotag"
version = "3.0.0"
description = "Geotag photos and videos using Google Timeline, GPX or KML location data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["tqdm>=4", "tzdata; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6", "mypy>=1.10", "types-tqdm"]

[project.scripts]
geotag = "exif_geotag.cli:main"

[tool.setuptools]
packages = ["exif_geotag"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["exif_geotag"]
