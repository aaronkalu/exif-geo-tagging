[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "exif-geotag"
version = "2.0.0"
description = "Geotag JPEG images using Google Timeline location data."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["tqdm>=4"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
geotag = "exif_geotag.cli:main"

[tool.setuptools]
packages = ["exif_geotag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
